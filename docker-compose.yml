version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: library-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
    container_name: library-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/library_management
      JWT_SECRET: replace-with-a-long-secret
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
    container_name: library-client
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongodb_data:
